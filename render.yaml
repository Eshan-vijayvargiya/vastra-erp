# One-click deploy on Render (free web service). The demo database is built on first start.
services:
  - type: web
    name: vastra-erp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: EXPORT_KEY
        value: vastra-demo
